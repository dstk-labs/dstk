---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: dstk-apollo
    app.kubernetes.io/name: dstk-apollo
  name: dstk-apollo
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: dstk-apollo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: dstk-apollo
        app.kubernetes.io/name: dstk-apollo
    spec:
      containers:
        - name: dstk-apollo
          image: dstk-apollo
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@dstk-postgres:5432/dstk
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: google-client-secret
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: github-client-id
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: github-client-secret
            - name: SMTP_HOST
              value: dstk-smtp
            - name: SMTP_PORT
              value: "25"
            - name: PORT
              value: "4000"
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: cors-origin
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: better-auth-secret
            - name: BETTER_AUTH_URL
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: better-auth-url
            - name: APP_URL
              valueFrom:
                secretKeyRef:
                  name: apollo-secret
                  key: app-url
          ports:
            - containerPort: 4000

---
apiVersion: v1
kind: Service
metadata:
  labels:
    io.kompose.service: dstk-apollo
  name: dstk-apollo
spec:
  ports:
    - name: "4000"
      port: 4000
  selector:
    io.kompose.service: dstk-apollo
