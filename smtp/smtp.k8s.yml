apiVersion: apps/v1
kind: Deployment
metadata:
  name: dstk-smtp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dstk-smtp
  template:
    metadata:
      labels:
        app: dstk-smtp
    spec:
      containers:
      - name: smtp4dev
        image: rnwood/smtp4dev:v3
        ports:
        - containerPort: 80
        - containerPort: 25
        - containerPort: 143
        - containerPort: 110

---
apiVersion: v1
kind: Service
metadata:
  name: dstk-smtp
spec:
  selector:
    app: dstk-smtp
  ports:
  - name: web
    port: 80
    targetPort: 80
  - name: smtp
    port: 25
    targetPort: 25
  - name: imap
    port: 143
    targetPort: 143
  - name: pop3
    port: 110
    targetPort: 110
